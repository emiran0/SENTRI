[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall

[env:plug]
platform = espressif32
board = esp32-s3-devkitc-1
; flashing and Serial both go through the UART port, so leave USB CDC off
build_flags = ${env.build_flags} -D SENTRI_PROFILE=PLUG

[env:camera]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -D SENTRI_PROFILE=CAMERA

[env:sensor]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
board_build.core = earlephilhower
build_flags = ${env.build_flags} -D SENTRI_PROFILE=SENSOR
