# Any change done, to apply a core-service restart is required. The service will be 
# restarted automatically if the config file is changed.

run_label: "tapo-idle-24h"

paths:
  db: /srv/sentri/sentri.db
  captures: /srv/sentri/captures
  # bind mounted out of the pihole container, see the compose file in ~/pihole
  pihole_log: /home/emiran/pihole/var-log-pihole/pihole.log
  nft_file: nftables/sentri.nft

capture:
  grace_seconds: 60
  poll_seconds: 30

network:
  gateway_ip: 192.168.50.1
  iface: eth1

exclude:
  macs:
    - "94:83:c4:8e:7b:80" # Opal 2 (5GHz) MAC 
    - "4a:aa:14:4b:bb:93" # Laptop MAC
    - "9c:69:d3:92:4b:9a" # eth1 MAC / Opal
    - "8e:49:76:ec:72:83" # Phone MAC
    # - "e0:d3:62:fb:cb:97" # Tapo Smart Bulb MAC
    - "88:a2:9e:d9:ab:47" # wlan0 MAC
  tcp_ports: [8080, 22]

learning:
  min_windows: 200
  learning_hours: 24
  hard_stop_hours: 72
  stability_fraction: 0.25
  learn_include_empty: false

# the subset the model consumes, extraction always computes all twelve
# pick this from tools/feature_report.py, not by guessing
model_features:
  - bytes_out_rate # volume out, pkts_out_rate is 0.99 with it
  - bytes_in_rate # volume in, pkts_in_rate is 0.99 with it
  - mean_pkt_size_out # size, absorbs std_pkt_size_out and both frac features at 0.98 to 1.00
  - mean_iat_out # timing, near orthogonal to every volume and size feature
  - std_iat_out # jitter, only 0.79 with mean_iat_out on e0:d3:62:fb:cb:97
  - distinct_peers # destination breadth
  - tcp_syn_rate # connection rate, at its floor on persistent TLS, live on the sensor node

thresholds:
  rule: p95_margin # max_margin | p99_margin | p95_margin | chi2
  # measured on 539 post cloud migration windows, calibration held out in 6 h blocks.
  # p95 with margin 1.0 lands under the chi2 floor, so t_alert is the floor at 22.46. that
  # still catches a 3x volume and a 2x cadence injection and leaves the periodic TP-Link
  # check in as isolated alert windows, which decide_tier never escalates past alert.
  # a 1.5x volume injection scores 4.7 against a normal maximum of 89 and is not separable
  # at any threshold that keeps normal traffic quiet, so do not tune for it
  alert_margin: 1.0
  # 4.0 put t_critical at 61 and sent 12 normal check in windows straight to block, with no
  # consecutive window guard on the critical path. 10.0 clears the observed normal maximum
  # on both devices and still blocks a 4x cadence injection
  critical_multiplier: 10.0
  deescalate_windows: 3

# smallest physically meaningful difference per feature, in the feature's model
# space (log1p applied where the feature table says so), used as a standard deviation
variance_floors:
  pkts_out_rate: 0.01
  pkts_in_rate: 0.01
  bytes_out_rate: 0.01
  bytes_in_rate: 0.01
  mean_pkt_size_out: 1.0
  std_pkt_size_out: 1.0
  mean_iat_out: 0.005
  std_iat_out: 0.005
  frac_small_out: 0.01
  frac_large_out: 0.01
  # distinct_peers counts destination keys, so its smallest possible difference is one
  # peer, and it is a log1p feature: log1p(2) - log1p(1) = 0.4055. the old 0.01 was the
  # raw space value left behind when the feature moved into the log set, which declared a
  # one peer change to be 40 to 70 sigma and sent every ordinary cloud endpoint rotation
  # straight to block. do not lower this without re-reading the log1p note above
  distinct_peers: 0.4055
  tcp_syn_rate: 0.01

enforcement:
  mode: observe
  never_enforce:
    - "aa:bb:cc:dd:ee:ff"
  auto_clear_hours: 2

ground_truth:
  # set to 60 seconds for injection tests
  poll_seconds: 300 
  nodes: {}
